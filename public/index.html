<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Private Classroom</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="landing">
    <div class="logo-badge">Live · Real-time sync</div>
    <h1>Private Classroom</h1>
    <p>Watch YouTube lessons together — synced in real-time with your teacher and classmates.</p>

    <div class="roles">
      <a href="/teacher.html" class="role-card">
        <span class="icon">👨‍🏫</span>
        <h2>Teacher</h2>
        <p>Create a room, paste videos, control what everyone sees instantly.</p>
      </a>
      <a href="/student.html" class="role-card">
        <span class="icon">🎒</span>
        <h2>Student</h2>
        <p>Join with a room code and watch whatever the teacher plays — live.</p>
      </a>
    </div>
  </div>
</body>
</html>
